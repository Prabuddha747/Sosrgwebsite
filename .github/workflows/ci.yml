name: CI

# Paused during active redesign iteration (fast-moving pushes across many
# phase branches) — manual trigger only for now. Restore push/pull_request
# triggers as a final step before the redesign work wraps up.
on:
  workflow_dispatch: {}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
